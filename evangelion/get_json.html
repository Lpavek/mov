<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Export Studio - Evangelion</title>
<style>
:root{
  --bg: #05040a; 
  --panel: #110e18; 
  --text: #e3e3e8;
  --muted: #8e8e99; 
  --eva-green: #54ff00; 
  --eva-purple: #7533e6; 
  --eva-orange: #ff7b00;
  --line: #221d33;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;}
body{min-height:100vh; padding-bottom: 80px;}
button,input,select{font:inherit}
button{cursor:pointer}

.hero{
  padding:30px 5vw 20px; background:#0a0812; border-bottom:1px solid var(--eva-purple);
  display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 15px;
}
.brand{font-weight:900;letter-spacing:.15em;font-size:12px;color:var(--eva-green)}
.hero h1{font-family: "Times New Roman", Times, serif; font-size:28px;margin:6px 0;text-transform:uppercase;letter-spacing:0.02em; text-shadow: 2px 2px 0px rgba(117, 51, 230, 0.5);}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.container{width:90vw;max-width: 1200px; margin:25px auto 0;}

/* AKORDEON */
.season-btn {
  width: 100%; text-align: left; background: #15111f; border: 1px solid var(--line);
  color: #fff; padding: 16px 20px; font-size: 18px; font-weight: 800; text-transform: uppercase;
  border-radius: 10px; margin-bottom: 10px; transition: 0.2s;
  display: flex; justify-content: space-between; align-items: center;
}
.season-btn:hover { background: #1e192e; border-color: var(--eva-purple); }
.season-arrow { transition: transform 0.3s ease; font-size: 14px; color: var(--eva-green); }
.season-wrapper.open ~ .season-btn .season-arrow { transform: rotate(180deg); }

.season-wrapper {
  max-height: 0; opacity: 0; overflow: hidden;
  transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.25s ease;
  padding: 0 5px;
}
.season-wrapper.open { max-height: 2500px; opacity: 1; padding: 10px 5px 20px 5px; }

/* GRID EPIZOD */
.season-content {
  display: grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap: 12px;
}
.card{
  background:var(--panel);border:1px solid var(--line); cursor:pointer;
  border-radius:10px;padding:16px;transition:0.15s;
  display:flex;flex-direction:column;justify-content:space-between; min-height: 100px;
}
.card:hover { border-color: var(--eva-purple); background: #1e192e; }
.card.has-link { border-color: var(--eva-green); background: rgba(84, 255, 0, 0.08); }
.ep{color:var(--eva-green);font-size:12px;font-weight:900; letter-spacing: 1px;}
.card h3{margin:4px 0 10px;font-size:15px; color:#fff;}
.status{font-size: 12px; font-weight: bold; color: var(--muted);}
.card.has-link .status { color: var(--eva-green); }

.empty-season-msg {
  color: var(--muted);
  font-size: 14px;
  font-weight: bold;
  padding: 24px;
  text-align: center;
  grid-column: 1 / -1;
  border: 1px dashed var(--line);
  border-radius: 10px;
}

/* AI CHAT CODE BLOCK STYLE */
.code-block-wrapper {
  margin-top: 40px;
}
.code-block-wrapper h2 {
  font-size: 18px; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: var(--eva-green);
}
.code-block {
  background: #0a0812; border: 1px solid var(--eva-purple); border-radius: 14px;
  overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.code-header {
  background: #110e18; padding: 12px 20px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center; color: var(--eva-green); font-size: 13px; font-weight: 700;
}
.code-controls {
  display: flex; gap: 8px;
}
.btn-tool {
  background: #1e192e; border: 1px solid #3d3552; color: #e3e3e8; border-radius: 8px;
  padding: 6px 14px; font-size: 13px; transition: 0.2s; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none;
}
.btn-tool:hover { background: #2a2340; color: #fff; border-color: var(--eva-purple); }
.btn-tool.danger:hover { background: var(--eva-orange); border-color: var(--eva-orange); color: #fff; }

.code-content {
  padding: 20px; margin: 0; color: #e3e3e8; font-family: 'Courier New', Courier, monospace; font-size: 14px;
  white-space: pre; overflow-x: auto; line-height: 1.6; min-height: 80px;
}
.json-key { color: var(--eva-green); font-weight: bold; }
.json-string { color: #fff; word-break: break-all; }
.json-bracket { color: var(--eva-purple); }

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(5, 4, 10, .85);display:none;z-index:30;padding:20px;align-items:center;justify-content:center;}
.modal.open{display:flex}
.panel{width:min(600px,100%);background:#110e18;border:1px solid var(--eva-purple);border-radius:14px;padding:25px}
.panel h3{margin-top:0; font-size: 20px; color: var(--eva-green);}
.formrow{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;margin:16px 0}
input,select{width:100%;background:#05040a;color:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px}
input:focus,select:focus{outline:none; border-color: var(--eva-green);}
.actions{display:flex;gap:10px;margin-top:22px; justify-content: flex-end;}
.action{border:0;border-radius:8px;padding:11px 20px;background:#221d33;color:#fff;font-weight:800; font-size: 14px; cursor: pointer;}
.action.primary{background:var(--eva-purple);color:#fff}
.action.danger{background:var(--eva-orange);color:#fff}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--eva-green);color:#000;padding:12px 24px;border-radius:8px;display:none;z-index:60;font-weight:800; box-shadow: 0 4px 15px rgba(0,0,0,0.4);}
</style>
</head>
<body>

<header class="hero">
  <div>
    <div class="brand">GENERÁTOR ODKAZŮ</div>
    <h1>EVANGELION JSON EXPORT</h1>
  </div>
  <div class="hero-actions">
    <a href="../index.html" class="btn-tool" title="Zpět na rozcestník">← Domů</a>
    <a href="evangelion.html" class="btn-tool" title="Zpět na přehrávač">📺 Přehrávač</a>
    <button class="btn-tool danger" onclick="clearAllData()">🗑 Smazat všechna data</button>
  </div>
</header>

<main class="container">
  <div id="container"></div>

  <!-- ŽIVÝ KÓDOVÝ BLOK -->
  <div class="code-block-wrapper">
    <h2>Vygenerovaný JSON kód</h2>
    <div class="code-block">
      <div class="code-header">
        <span>JSON</span>
        <div class="code-controls">
          <button class="btn-tool" onclick="clearJSONCode()">🗑 Vymazat kód</button>
          <button class="btn-tool" onclick="copyJSON()">📋 Zkopírovat kód</button>
        </div>
      </div>
      <pre class="code-content" id="jsonOutputCode"></pre>
    </div>
  </div>
</main>

<div id="adminModal" class="modal" onclick="if(event.target===this)closeAdmin()">
  <div class="panel">
    <h3 id="modalTitle">Úprava epizody</h3>
    <div class="formrow"><label>Epizoda</label><select id="episodeSelect"></select></div>
    <div class="formrow"><label>Odkaz</label><input id="urlInput" placeholder="Vlož https://...mp4"></div>
    <div class="actions">
      <button class="action primary" onclick="saveLink()">Uložit</button>
      <button class="action danger" onclick="removeLink()">Smazat odkaz</button>
      <button class="action" onclick="closeAdmin()">Zavřít</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const EPISODES = [
  {id:1, s:1, e:1, title:"Šito, šúrai"}, 
  {id:2, s:1, e:2, title:"Miširanu, tendžó"}, 
  {id:3, s:1, e:3, title:"Naranai, denwa"}, 
  {id:4, s:1, e:4, title:"Ame, nigedašita ato"}, 
  {id:5, s:1, e:5, title:"Rei, kokoro no mukó ni"}, 
  {id:6, s:1, e:6, title:"Kessen, daisan šin Tókjó-ši"}, 
  {id:7, s:1, e:7, title:"Hito to cukurišimono"}, 
  {id:8, s:1, e:8, title:"Asuka, rainiči"}, 
  {id:9, s:1, e:9, title:"Šunkan, kokoro, kasanete"}, 
  {id:10, s:1, e:10, title:"Magma diver"}, 
  {id:11, s:1, e:11, title:"Seiši šita jami no naka de"}, 
  {id:12, s:1, e:12, title:"Kiseki wa kači da"}, 
  {id:13, s:1, e:13, title:"Šito, šinnjú"}, 
  {id:14, s:1, e:14, title:"Seele, tamaší no za"}, 
  {id:15, s:1, e:15, title:"Uso to činmoku"}, 
  {id:16, s:1, e:16, title:"Ši ni itaru jamai, sošite"}, 
  {id:17, s:1, e:17, title:"Joninme no tekikakuša"}, 
  {id:18, s:1, e:18, title:"Inoči no sentaku o"}, 
  {id:19, s:1, e:19, title:"Otoko no tatakai"}, 
  {id:20, s:1, e:20, title:"Kokoro no katači, hito no katači"}, 
  {id:21, s:1, e:21, title:"NERV, tandžó"}, 
  {id:22, s:1, e:22, title:"Semete, ningen rašiku"}, 
  {id:23, s:1, e:23, title:"Namida"}, 
  {id:24, s:1, e:24, title:"Saigo no šiša"}, 
  {id:25, s:1, e:25, title:"Owaru sekai"}, 
  {id:26, s:1, e:26, title:"Sekai no čúšin de 'ai' o sakenda kemono"}
];

const SEASONS = [1];
const KEY = "evangelion_export_links_v1";
const LAST_SEASON_KEY = "evangelion_export_last_opened_season";

let links = JSON.parse(localStorage.getItem(KEY) || "{}");

const $ = id => document.getElementById(id);

function formatSE(s, e) {
  return "S" + (s < 10 ? "0" + s : s) + "E" + (e < 10 ? "0" + e : e);
}

function render() {
  let html = "";
  const lastSeason = localStorage.getItem(LAST_SEASON_KEY);
  
  SEASONS.forEach(s => {
    let seasonLabel = "SÉRIE " + s;
    const isOpen = (String(s) === String(lastSeason)) ? " open" : "";

    html += `<button class="season-btn" onclick="toggleSeason(${s})">
              <span>${seasonLabel}</span><span class="season-arrow">▼</span>
             </button>`;
             
    html += `<div id="season-${s}" class="season-wrapper${isOpen}">`;
    html += `<div class="season-content">`;
    
    const seasonEpisodes = EPISODES.filter(ep => ep.s === s);
    
    if(seasonEpisodes.length === 0) {
      html += `<div class="empty-season-msg">Tato série zatím neobsahuje žádné epizody.</div>`;
    } else {
      seasonEpisodes.forEach(ep => {
        const hasLink = !!links[ep.id];
        const cls = hasLink ? "card has-link" : "card";
        const statusText = hasLink ? "✔ Odkaz vložen" : "○ Bez odkazu";
        
        html += `<article class="${cls}" onclick="openAdmin(${ep.id})">
          <div class="ep">${formatSE(ep.s, ep.e)}</div>
          <h3>${ep.title}</h3>
          <div class="status">${statusText}</div>
        </article>`;
      });
    }
    
    html += `</div></div>`;
  });
  
  $("container").innerHTML = html;
  
  $("episodeSelect").innerHTML = EPISODES.map(ep => 
    `<option value="${ep.id}">${formatSE(ep.s, ep.e)} - ${ep.title}</option>`
  ).join("");
  $("episodeSelect").onchange = loadSelected;

  updateLiveJSONOutput();
}

function toggleSeason(s) {
  const target = $("season-" + s);
  const isOpen = target.classList.contains("open");
  
  SEASONS.forEach(season => {
    $("season-" + season).classList.remove("open");
  });

  if (!isOpen) {
    target.classList.add("open");
    localStorage.setItem(LAST_SEASON_KEY, String(s));
  } else {
    localStorage.removeItem(LAST_SEASON_KEY);
  }
}

function openAdmin(epId) {
  $("adminModal").classList.add("open");
  $("episodeSelect").value = epId;
  loadSelected();
  setTimeout(() => $("urlInput").focus(), 100);
}

function closeAdmin() {
  $("adminModal").classList.remove("open");
}

function loadSelected() { 
  $("urlInput").value = links[$("episodeSelect").value] || ""; 
}

function saveLink() {
  const id = $("episodeSelect").value;
  const url = $("urlInput").value.trim();
  
  if (!url) { toast("Odkaz nemůže být prázdný."); return; }
  
  links[id] = url;
  localStorage.setItem(KEY, JSON.stringify(links));
  render();
  closeAdmin();
  toast("Odkaz uložen.");
}

function removeLink() {
  const id = $("episodeSelect").value;
  delete links[id];
  localStorage.setItem(KEY, JSON.stringify(links));
  render();
  closeAdmin();
  toast("Odkaz odstraněn.");
}

function clearJSONCode() {
  $("jsonOutputCode").innerHTML = '<span class="json-bracket">{\n}</span>';
  toast("Kód vymazán.");
}

function clearAllData() {
  if (confirm("Opravdu chceš smazat úplně všechny odkazované epizody?")) {
    links = {};
    localStorage.removeItem(KEY);
    render();
    toast("Všechna data byla smazána.");
  }
}

function updateLiveJSONOutput() {
  const keys = Object.keys(links);
  
  if (keys.length === 0) {
    $("jsonOutputCode").innerHTML = '<span class="json-bracket">{\n}</span>';
    return;
  }

  keys.sort((a, b) => Number(a) - Number(b));

  let html = '<span class="json-bracket">{\n</span>';
  keys.forEach((key, index) => {
    const isLast = index === keys.length - 1;
    const comma = isLast ? "" : ",";
    html += `  <span class="json-key">"${key}"</span>: <span class="json-string">"${escapeHtml(links[key])}"</span>${comma}\n`;
  });
  html += '<span class="json-bracket">}</span>';

  $("jsonOutputCode").innerHTML = html;
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function copyJSON() {
  const keys = Object.keys(links);
  if (keys.length === 0) {
    toast("Není co kopírovat, JSON je prázdný.");
    return;
  }
  
  const cleanObject = {};
  keys.sort((a, b) => Number(a) - Number(b)).forEach(k => cleanObject[k] = links[k]);
  
  const textToCopy = JSON.stringify(cleanObject, null, 2);
  
  navigator.clipboard.writeText(textToCopy).then(() => {
    toast("Zkopírováno do schránky!");
  }).catch(() => {
    toast("Chyba při kopírování.");
  });
}

function toast(t) {
  $("toast").textContent = t;
  $("toast").style.display = "block";
  setTimeout(() => $("toast").style.display = "none", 1800);
}

render();
</script>
</body>
</html>
