<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Přehrávač seriálů — EVANGELION</title>
<style>
:root{
  --bg: #05040a; 
  --panel: #110e18; 
  --text: #f2f2f2;
  --muted: #8a8893; 
  --eva-green: #54ff00; 
  --eva-purple: #7533e6; 
  --eva-orange: #ff7b00;
  --line: #221d33;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;user-select:none;width:100%;height:100%;overflow-x:hidden}

:focus, .tv-focus {
  outline: none !important;
  border-color: var(--eva-green) !important;
  box-shadow: 0 0 25px rgba(84, 255, 0, 0.4) !important;
  transform: scale(1.03);
  z-index: 5;
}

.hero{
  padding:30px 5vw 15px; background: #0a0812; border-bottom:2px solid var(--eva-purple);
  display: flex; justify-content: space-between; align-items: flex-end;
}
.brand{font-weight:900;letter-spacing:.15em;font-size:13px;color:var(--eva-green)}
.hero h1{
  font-family: "Times New Roman", Times, serif;
  font-size:42px;
  margin:8px 0 0;
  text-transform:uppercase;
  letter-spacing:0.02em;
  text-shadow: 3px 3px 0px rgba(117, 51, 230, 0.5);
}

.hero-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.top-btn {
  background: #181522; border: 1px solid #3d3552; color: #e3e3e8; border-radius: 8px;
  padding: 8px 16px; font-size: 13px; text-decoration: none; font-weight: 700;
  display: flex; align-items: center; gap: 8px; transition: 0.2s; cursor: pointer;
}
.top-btn:hover, .top-btn:focus { background: #252033; border-color: var(--eva-green); color: #fff; }

.container{width:90vw;margin:20px auto 0; padding-bottom: 100px;}

.season-btn {
  width: 100%; text-align: left; background: #15111f; border: 2px solid var(--line);
  color: #fff; padding: 22px 25px; font-size: 22px; font-weight: 800; text-transform: uppercase;
  border-radius: 8px; margin-bottom: 10px; transition: 0.2s; letter-spacing: 2px;
  display: flex; justify-content: space-between; align-items: center; cursor: pointer;
}
.season-btn:hover, .season-btn:focus { background: #1e192e; border-color: var(--eva-purple); }

.season-arrow { transition: transform 0.3s ease; font-size: 18px; color: var(--eva-green); }
.season-wrapper.open ~ .season-btn .season-arrow { transform: rotate(180deg); }

.season-wrapper {
  max-height: 0; opacity: 0; overflow: hidden;
  transition: max-height 0.4s ease-in-out, opacity 0.3s ease-in-out, padding 0.3s ease;
  padding: 0 5px;
}
.season-wrapper.open {
  max-height: 2500px; opacity: 1; padding: 10px 5px 25px 5px;
}

.season-content {
  display: grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap: 16px;
}

.empty-season-msg {
  color: var(--muted);
  font-size: 16px;
  font-weight: bold;
  padding: 20px;
  text-align: center;
  grid-column: 1 / -1;
  border: 2px dashed var(--line);
  border-radius: 8px;
}

.card{
  background:var(--panel);border:2px solid var(--line); cursor:pointer;
  border-radius:8px;padding:20px;min-height:150px;transition:transform 0.15s, border-color 0.15s;
  display:flex;flex-direction:column;justify-content:space-between;
}
.ep{color:var(--eva-green);font-size:14px;font-weight:900; letter-spacing: 1px;}
.card h3{margin:8px 0 14px;font-size:18px; color:#fff;}
.play{border:0;border-radius:4px;background:#221d33;color:#fff;padding:10px 16px;font-weight:800;font-size:14px; cursor:pointer;}
.card:focus .play, .card:focus-within .play, .card:hover .play { background:var(--eva-purple);color:#fff; }

.admin{
  position:fixed;right:25px;bottom:25px;border:2px solid var(--eva-purple);background:#110e18;color:#fff;
  border-radius:50px;padding:12px 20px;z-index:20;font-weight:700;font-size:14px; cursor:pointer;
}

.modal{position:fixed;inset:0;background:rgba(5, 4, 10, .92);display:none;z-index:30;padding:30px 15px;overflow:auto}
.modal.open{display:block}
.panel{width:min(700px,100%);margin:auto;background:#110e18;border:2px solid var(--eva-purple);border-radius:10px;padding:25px}
.panel h2{margin-top:0; color: var(--eva-green);}
.formrow{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin:12px 0}
input,select{width:100%;background:#05040a;color:#fff;border:2px solid var(--line);border-radius:6px;padding:10px;font-size:15px}
input:focus,select:focus{outline:none; border-color: var(--eva-green);}
.actions{display:flex;gap:10px;margin-top:20px}
.action{border:0;border-radius:6px;padding:10px 16px;background:#221d33;color:#fff;font-weight:800; cursor:pointer;}
.action.primary{background:var(--eva-purple);color:#fff}

.player{
  display:none; position:fixed; top:0; left:0; width:100vw; height:100vh;
  background:#000; z-index:999999; flex-direction:column; cursor:default;
}
.player.open{ display:flex !important; }
.player.hide-ui { cursor: none; }

body.in-player .hero,
body.in-player .container,
body.in-player .admin {
  display: none !important;
}

.video-wrap{position:relative;width:100%;height:100%;flex:1;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
video{width:100%;height:100%;object-fit:contain;background:#000}

.custom-subtitles {
  position: absolute;
  bottom: 85px;
  left: 50%;
  transform: translateX(-50%);
  width: fit-content;
  max-width: 85%;
  background: rgba(0, 0, 0, 0.78);
  color: #fff;
  font-family: Arial, sans-serif;
  font-size: 25px;
  line-height: 1.35;
  padding: 6px 16px;
  border-radius: 6px;
  text-shadow: 2px 2px 4px #000;
  font-weight: 600;
  text-align: center;
  z-index: 180;
  cursor: grab;
  user-select: none;
  pointer-events: auto;
  white-space: pre-wrap;
  display: none;
  border: 1px solid transparent;
  transition: border-color 0.15s ease;
}
.custom-subtitles:hover {
  border-color: rgba(255, 255, 255, 0.35);
}
.custom-subtitles.dragging {
  cursor: grabbing !important;
  border-color: var(--eva-green) !important;
}

.touch-overlay-controls {
  position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center;
  padding: 0 4vw; pointer-events: none; z-index: 150; transition: opacity 0.25s ease;
}
.player.hide-ui .touch-overlay-controls { opacity: 0; pointer-events: none; }

.big-touch-btn {
  pointer-events: auto; background: rgba(17, 14, 24, 0.85); border: 2px solid var(--eva-purple);
  color: #fff; width: 100px; height: 100px; border-radius: 50%; font-size: 20px; font-weight: 900;
  display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 0 20px rgba(117, 51, 230, 0.3); transition: transform 0.15s, background 0.15s, border-color 0.15s;
}
.big-touch-btn:hover, .big-touch-btn:focus { transform: scale(1.15); background: var(--eva-purple); border-color: var(--eva-green); }
.big-touch-btn.center { width: 90px; height: 90px; font-size: 28px; }

.skip-intro-btn {
  position: absolute; left: 4vw; bottom: 100px; z-index: 160;
  background: rgba(17, 14, 24, 0.75); border: 1px solid var(--eva-purple);
  color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 13px; font-weight: 700;
  letter-spacing: 0.05em; cursor: pointer; display: none; backdrop-filter: blur(4px);
  transition: opacity 0.2s, background 0.2s, border-color 0.2s, color 0.2s;
}
.skip-intro-btn:hover, .skip-intro-btn:focus {
  background: var(--eva-purple); border-color: var(--eva-green); color: #fff;
}
.player.hide-ui .skip-intro-btn { opacity: 0; pointer-events: none; }

.next-ep-btn-clean {
  position: absolute; right: 4vw; bottom: 100px; z-index: 160;
  background: rgba(17, 14, 24, 0.85); border: 2px solid var(--eva-green);
  color: #fff; padding: 12px 22px; border-radius: 6px; font-size: 15px; font-weight: 800;
  cursor: pointer; display: none; box-shadow: 0 4px 15px rgba(84, 255, 0, 0.2);
  transition: opacity 0.2s, transform 0.15s, background 0.15s;
}
.next-ep-btn-clean:hover, .next-ep-btn-clean:focus {
  background: var(--eva-green); color: #000; transform: scale(1.05);
}
.player.hide-ui .next-ep-btn-clean { opacity: 0; pointer-events: none; }

.resume-card {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(17, 14, 24, 0.96); border: 2px solid var(--eva-purple);
  border-radius: 12px; padding: 25px 30px; display: none; flex-direction: column; align-items: center; gap: 18px;
  box-shadow: 0 10px 40px rgba(117, 51, 230, 0.4); z-index: 200; backdrop-filter: blur(10px); text-align: center;
}
.resume-card.show { display: flex; }
.resume-title { font-size: 20px; font-weight: 800; color: #fff; }
.resume-time { font-size: 15px; color: #aaa; }
.resume-time span { color: var(--eva-green); font-weight: bold; }
.resume-actions { display: flex; gap: 15px; margin-top: 5px; }
.resume-btn {
  border: 0; border-radius: 6px; padding: 12px 24px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.15s;
}
.resume-btn.ok { background: var(--eva-purple); color: #fff; }
.resume-btn.no { background: #221d33; color: #ccc; }
.resume-btn:focus, .resume-btn:hover { transform: scale(1.08); border: 1px solid var(--eva-green); }

.player-ui, .player-top{position:absolute;transition:opacity .25s ease, transform .25s ease;z-index:100}
.player-top{
  top:0;left:0;right:0;padding:25px 4vw;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(0,0,0,0.95),transparent); pointer-events:none;
}
.player-top * { pointer-events:auto; }
.now{font-family:"Times New Roman", Times, serif; font-weight:800;font-size:22px;color:var(--eva-green); letter-spacing:1px;}
.close{background:rgba(117, 51, 230, 0.9);border:0;color:#fff;padding:8px 16px;border-radius:6px;font-size:18px;font-weight:bold; cursor:pointer;}

.player-ui{
  bottom:0;left:0;right:0;padding:40px 4vw 25px;
  background:linear-gradient(0deg,rgba(0,0,0,0.95),transparent);
}
.player.hide-ui .player-ui{opacity:0;transform:translateY(15px);pointer-events:none}
.player.hide-ui .player-top{opacity:0;transform:translateY(-15px);pointer-events:none}

.progress-container{ position:relative; padding:10px 0; cursor:pointer; margin-bottom:8px; }
.progress{ height:8px; background:#221d33; border-radius:4px; position:relative; }
.progress-bar{ height:100%; width:0; background:var(--eva-green); border-radius:4px; position:relative; box-shadow: 0 0 10px rgba(84,255,0,0.5);}
.progress-bar::after{
  content:''; position:absolute; right:-6px; top:-4px; width:16px; height:16px; background:#fff; border-radius:50%; opacity:0; transition:opacity 0.15s;
}
.progress-container:hover .progress-bar::after{ opacity:1; }

.timeline-tooltip{
  position:absolute; bottom:25px; transform:translateX(-50%); background:#110e18; color:#fff;
  padding:4px 8px; border-radius:4px; font-size:12px; display:none; pointer-events:none;
  box-shadow:0 2px 10px rgba(117,51,230,0.4); border:1px solid var(--eva-purple); white-space:nowrap; font-weight:700;
}

.controls{display:flex;align-items:center;gap:12px}
.ctrl{width:50px;height:44px;border:2px solid transparent;border-radius:6px;background:rgba(21,17,31,.9);color:#fff;font-size:18px; cursor:pointer; font-weight: bold;}
.ctrl:hover, .ctrl:focus{background:#2a2340; border-color: var(--eva-purple);}
.ctrl.active{background:var(--eva-purple);border-color:var(--eva-green)}
.ctrl.hidden{display:none}
.time{font-variant-numeric:tabular-nums;color:#ddd;font-size:15px;margin:0 8px;font-weight:700}
.spacer{flex:1}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--eva-green);color:#000;padding:10px 20px;border-radius:6px;display:none;z-index:60;font-weight:800}
</style>
</head>
<body>

<header class="hero">
  <div>
    <div class="brand">KNIHOVNA / SERIÁLY</div>
    <h1>GENESIS EVANGELION</h1>
  </div>
  <div class="hero-actions">
    <a href="../index.html" class="top-btn" tabindex="0" title="Zpět na rozcestník">
      <span>←</span> Domů
    </a>
    <a href="get_json.html" class="top-btn" tabindex="0" title="Otevřít JSON Generátor">
      <span>📋</span> JSON Generator
    </a>
  </div>
</header>

<main class="container" id="container">
</main>

<button class="admin" id="adminBtn" tabindex="0" onclick="openAdmin()">⚙ Nastavení</button>

<div id="adminModal" class="modal">
  <div class="panel">
    <h2>Správa odkazů</h2>
    <div class="formrow"><label>Epizoda</label><select id="episodeSelect" tabindex="0"></select></div>
    <div class="formrow"><label>Odkaz</label><input id="urlInput" placeholder="https://example.com/video.mp4" tabindex="0"></div>
    <div class="actions">
      <button class="action primary" id="saveBtn" tabindex="0" onclick="saveLink()">Uložit dočasně</button>
      <button class="action" tabindex="0" onclick="closeAdmin()">Zavřít</button>
    </div>
  </div>
</div>

<div id="player" class="player">
  <div class="video-wrap" id="videoWrap">
    
    <div class="touch-overlay-controls" id="touchControls">
      <button class="big-touch-btn" onclick="seekBy(-10)" title="-10 sekund">
        <span>↶</span>
        <span style="font-size:12px;">-10s</span>
      </button>
      
      <button class="big-touch-btn center" id="bigPlayBtn" onclick="togglePlay()" title="Pauza / Play">
        ▶
      </button>

      <button class="big-touch-btn" onclick="seekBy(10)" title="+10 sekund">
        <span>↷</span>
        <span style="font-size:12px;">+10s</span>
      </button>
    </div>

    <!-- Plovoucí vrstva pro Drag & Drop titulky -->
    <div id="subtitlesOverlay" class="custom-subtitles" title="Táhnutím myši přemístíš titulky (dvojklik pro reset pozice)"></div>

    <!-- TLAČÍTKO PŘESKOČIT ÚVOD (DO 3:15) -->
    <button class="skip-intro-btn" id="skipIntroBtn" onclick="skipIntro()">
      Přeskočit úvod ▶
    </button>

    <!-- TLAČÍTKO DALŠÍ DÍL (50 SEKUND PŘED KONCEM) -->
    <button class="next-ep-btn-clean" id="nextEpBtnClean" onclick="playNextEpisode()">
      Další díl ▶
    </button>

    <div class="resume-card" id="resumeCard">
      <div class="resume-title">Pokračovat v přehrávání?</div>
      <div class="resume-time">Minule jsi skončil v čase <span id="resumeTimeStr">0:00</span></div>
      <div class="resume-actions">
        <button class="resume-btn ok" id="resumeOkBtn" tabindex="0" onclick="confirmResume(true)">OK chci</button>
        <button class="resume-btn no" id="resumeNoBtn" tabindex="0" onclick="confirmResume(false)">✕ nechci</button>
      </div>
    </div>

    <div class="player-top">
      <div class="now" id="now"></div>
      <button class="ctrl close" id="closePlayerBtn" tabindex="0" onclick="closePlayer()">✕ Zavřít</button>
    </div>

    <video id="video" playsinline preload="metadata"></video>
    
    <div class="player-ui" id="playerUI">
      <div class="progress-container" id="progressContainer">
        <div class="timeline-tooltip" id="tooltip">0:00</div>
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      </div>
      <div class="controls">
        <button class="ctrl" id="seekBackBtn" tabindex="0" onclick="seekBy(-10)">↶</button>
        <button class="ctrl" id="playBtn" tabindex="0" onclick="togglePlay()">▶</button>
        <button class="ctrl" id="seekForwardBtn" tabindex="0" onclick="seekBy(10)">↷</button>
        <span class="time" id="time">0:00 / 0:00</span>
        <span class="spacer"></span>
        <button class="ctrl hidden" id="ccBtn" tabindex="0" onclick="toggleCC()" title="Titulky (CC)">CC</button>
        <button class="ctrl" id="muteBtn" tabindex="0" onclick="toggleMute()">🔊</button>
        <button class="ctrl" id="fullBtn" tabindex="0" onclick="toggleFullscreen()">⛶ Maximovat</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
var EPISODES = [
  {id:1, s:1, e:1, title:"Šito, šúrai"}, 
  {id:2, s:1, e:2, title:"Miširanu, tendžó"}, 
  {id:3, s:1, e:3, title:"Naranai, denwa"}, 
  {id:4, s:1, e:4, title:"Ame, nigedašita ato"}, 
  {id:5, s:1, e:5, title:"Rei, kokoro no mukó ni"}, 
  {id:6, s:1, e:6, title:"Kessen, daisan šin Tókjó-ši"}, 
  {id:7, s:1, e:7, title:"Hito to cukurišimono"}, 
  {id:8, s:1, e:8, title:"Asuka, rainiči"}, 
  {id:9, s:1, e:9, title:"Šunkan, kokoro, kasanete"}, 
  {id:10, s:1, e:10, title:"Magma diver"}, 
  {id:11, s:1, e:11, title:"Seiši šita jami no naka de"}, 
  {id:12, s:1, e:12, title:"Kiseki wa kači da"}, 
  {id:13, s:1, e:13, title:"Šito, šinnjú"}, 
  {id:14, s:1, e:14, title:"Seele, tamaší no za"}, 
  {id:15, s:1, e:15, title:"Uso to činmoku"}, 
  {id:16, s:1, e:16, title:"Ši ni itaru jamai, sošite"}, 
  {id:17, s:1, e:17, title:"Joninme no tekikakuša"}, 
  {id:18, s:1, e:18, title:"Inoči no sentaku o"}, 
  {id:19, s:1, e:19, title:"Otoko no tatakai"}, 
  {id:20, s:1, e:20, title:"Kokoro no katači, hito no katači"}, 
  {id:21, s:1, e:21, title:"NERV, tandžó"}, 
  {id:22, s:1, e:22, title:"Semete, ningen rašiku"}, 
  {id:23, s:1, e:23, title:"Namida"}, 
  {id:24, s:1, e:24, title:"Saigo no šiša"}, 
  {id:25, s:1, e:25, title:"Owaru sekai"}, 
  {id:26, s:1, e:26, title:"Sekai no čúšin de 'ai' o sakenda kemono"}
];

var SEASONS = [1];
var INTRO_THRESHOLD = 90; // Intro Evangelionu je kratší, přizpůsobeno na 90s
var NEXT_EPISODE_TRIGGER = 50;
var PROGRESS_KEY = "evangelion_saved_progress_v1";
var LAST_SEASON_KEY = "evangelion_last_opened_season";

var links = {};
var savedProgress = JSON.parse(localStorage.getItem(PROGRESS_KEY) || "{}");

var current = 0, hideTimer = null, clickTimer = null;
var isSeeking = false;
var isPerformingSeek = false;
var pendingSeekTarget = null;
var pendingResumeTime = 0;

var subtitlesActive = true;
var currentSubTrack = null;

function $(id){ return document.getElementById(id); }

function formatSE(s, e){
  return "S" + (s < 10 ? "0" + s : s) + "E" + (e < 10 ? "0" + e : e);
}

function getSubtitlePath(ep) {
  var eStr = (ep.e < 10 ? "0" + ep.e : String(ep.e));
  var sStr = (ep.s < 10 ? "0" + ep.s : String(ep.s));
  return "titulky/S" + sStr + eStr + ".vtt";
}

function getEpisode(id) {
  for(var i=0; i<EPISODES.length; i++) {
    if(EPISODES[i].id == id) return EPISODES[i];
  }
  return null;
}

function loadAutoJSON() {
  fetch('episodes.json?v=' + new Date().getTime())
    .then(function(res){
      if(res.ok) return res.json();
      return {};
    })
    .then(function(data){
      links = data || {};
      render();
    })
    .catch(function(err){
      render();
    });
}

function render(){
  var html = "";
  var lastSeason = localStorage.getItem(LAST_SEASON_KEY);

  for(var i=0; i<SEASONS.length; i++) {
    var s = SEASONS[i];
    var seasonLabel = "SÉRIE " + s;
    var isOpen = (String(s) === String(lastSeason)) ? " open" : "";
    
    html += '<button class="season-btn" id="btn-season-' + s + '" tabindex="0" onclick="toggleSeason(' + s + ')">' + 
            '<span>' + seasonLabel + '</span>' +
            '<span class="season-arrow">▼</span>' + 
            '</button>';
            
    html += '<div id="season-' + s + '" class="season-wrapper' + isOpen + '">';
    html += '<div class="season-content">';
    
    var seasonEpisodes = EPISODES.filter(function(ep){ return ep.s === s; });
    
    if(seasonEpisodes.length === 0) {
      html += '<div class="empty-season-msg">Tato série zatím neobsahuje žádné epizody.</div>';
    } else {
      for(var j=0; j<seasonEpisodes.length; j++){
        var ep = seasonEpisodes[j];
        var key = String(ep.id);
        var hasLink = links[key] && links[key].trim().length > 0;
        var seText = formatSE(ep.s, ep.e);
        
        html += '<article class="card" tabindex="0" data-ep="' + ep.id + '" onclick="playEpisode(' + ep.id + ')">' +
          '<div class="ep">' + seText + '</div>' +
          '<h3>' + ep.title + '</h3>' +
          '<button class="play" tabindex="-1">' + (hasLink ? "▶ Přehrát" : "○ Bez odkazu") + '</button>' +
        '</article>';
      }
    }
    
    html += '</div></div>';
  }
  
  $("container").innerHTML = html;
}

function toggleSeason(s) {
  var targetDiv = $("season-" + s);
  var isCurrentlyOpen = targetDiv.className.indexOf("open") !== -1;

  for(var i=0; i<SEASONS.length; i++) {
    var seasonDiv = $("season-" + SEASONS[i]);
    if (seasonDiv) seasonDiv.className = "season-wrapper";
  }

  if (!isCurrentlyOpen) {
    targetDiv.className = "season-wrapper open";
    localStorage.setItem(LAST_SEASON_KEY, String(s));
  } else {
    localStorage.removeItem(LAST_SEASON_KEY);
  }
}

function openAdmin(){
  $("adminModal").className = "modal open";
  var html = "";
  for(var i=0; i<EPISODES.length; i++){
    var ep = EPISODES[i];
    var titleStr = formatSE(ep.s, ep.e) + " - " + ep.title;
    html += '<option value="' + ep.id + '">' + titleStr + '</option>';
  }
  $("episodeSelect").innerHTML = html;
  $("episodeSelect").onchange = loadSelected;
  loadSelected();
  $("episodeSelect").focus();
}

function closeAdmin(){
  $("adminModal").className = "modal";
  $("adminBtn").focus();
}

function loadSelected(){ 
  var key = String($("episodeSelect").value);
  $("urlInput").value = links[key] || ""; 
}

function saveLink(){
  var n = String($("episodeSelect").value);
  var url = $("urlInput").value.trim();
  if(!url){ toast("Vlož nejdřív odkaz."); return; }
  links[n] = url;
  render(); 
  toast("Dočasně uloženo.");
}

function updateSubtitlesDisplay(track) {
  var subEl = $("subtitlesOverlay");
  if (!subEl) return;
  if (!track && currentSubTrack) track = currentSubTrack;
  if (!track) {
    var v = $("video");
    if (v && v.textTracks && v.textTracks.length > 0) {
      track = v.textTracks[0];
    }
  }
  if (!subtitlesActive || !track || !track.activeCues || track.activeCues.length === 0) {
    subEl.style.display = "none";
    subEl.innerHTML = "";
    return;
  }
  var html = "";
  for (var i = 0; i < track.activeCues.length; i++) {
    html += (i > 0 ? "<br>" : "") + track.activeCues[i].text.replace(/\n/g, "<br>");
  }
  subEl.innerHTML = html;
  subEl.style.display = "block";
}

function resetSubtitlePosition() {
  var subEl = $("subtitlesOverlay");
  subEl.style.top = "auto";
  subEl.style.bottom = "85px";
  subEl.style.left = "50%";
  subEl.style.transform = "translateX(-50%)";
}

function playEpisode(id){
  var key = String(id);
  var ep = getEpisode(id);
  
  if(!links[key]){ 
    openAdmin(); 
    $("episodeSelect").value = id; 
    loadSelected(); 
    toast(formatSE(ep.s, ep.e) + " nemá odkaz."); 
    return; 
  }
  
  current = id; 
  isPerformingSeek = false;
  pendingSeekTarget = null;
  $("skipIntroBtn").style.display = "none";
  $("nextEpBtnClean").style.display = "none";

  var v = $("video");
  $("now").textContent = formatSE(ep.s, ep.e) + " - " + ep.title;
  v.src = links[key];

  // Reset stop a vrstvy titulků
  var oldTrack = document.getElementById("dynSubTrack");
  if(oldTrack) oldTrack.remove();
  currentSubTrack = null;
  $("subtitlesOverlay").style.display = "none";
  $("subtitlesOverlay").innerHTML = "";
  $("ccBtn").className = "ctrl hidden";
  resetSubtitlePosition();

  // Načtení titulků a napojení na plovoucí vrstvu
  var subUrl = getSubtitlePath(ep);
  fetch(subUrl + '?v=' + new Date().getTime())
    .then(function(res){
      if(!res.ok) throw new Error("Titulky nenalezeny");
      return res.text();
    })
    .then(function(vttContent){
      if(vttContent && vttContent.trim().length > 0){
        var blob = new Blob([vttContent], { type: 'text/vtt' });
        var track = document.createElement("track");
        track.id = "dynSubTrack";
        track.kind = "subtitles";
        track.label = "Čeština";
        track.srclang = "cs";
        track.src = URL.createObjectURL(blob);
        track.default = true;
        
        track.addEventListener("load", function() {
          currentSubTrack = this.track;
          currentSubTrack.mode = "hidden"; // Skryje nativní vykreslení
          currentSubTrack.oncuechange = function() {
            updateSubtitlesDisplay(this);
          };
        });

        v.appendChild(track);
        subtitlesActive = true;
        $("ccBtn").className = "ctrl active";
      }
    })
    .catch(function(){
      $("ccBtn").className = "ctrl hidden";
    });
  
  document.body.className = "in-player";
  $("player").className = "player open";
  window.scrollTo(0, 0);

  var savedTime = savedProgress[key];
  if (savedTime && savedTime > 5) {
    pendingResumeTime = savedTime;
    $("resumeTimeStr").textContent = fmt(savedTime);
    $("resumeCard").className = "resume-card show";
    $("resumeOkBtn").focus();
  } else {
    pendingResumeTime = 0;
    $("resumeCard").className = "resume-card";
    v.play().catch(function(){});
    $("playBtn").focus();
  }

  resetUIHide();
}

function confirmResume(shouldResume) {
  $("resumeCard").className = "resume-card";
  var v = $("video");
  
  if (shouldResume && pendingResumeTime > 0) {
    var target = pendingResumeTime;
    if (v.readyState >= 1) {
      applySafeSeek(target);
    } else {
      var onMeta = function(){
        v.removeEventListener("loadedmetadata", onMeta);
        applySafeSeek(target);
      };
      v.addEventListener("loadedmetadata", onMeta);
    }
  } else {
    v.play().catch(function(){});
  }
  
  pendingResumeTime = 0;
  resetUIHide();
  $("playBtn").focus();
}

/* BEZPEČNÉ PŘETÁČENÍ */
function applySafeSeek(targetTime) {
  var v = $("video");
  if (!v.duration) return;

  var clampedTime = Math.max(0, Math.min(v.duration, targetTime));

  if (isPerformingSeek) {
    pendingSeekTarget = clampedTime;
    return;
  }

  isPerformingSeek = true;
  v.currentTime = clampedTime;
}

$("video").addEventListener("seeked", function(){
  isPerformingSeek = false;
  if (pendingSeekTarget !== null) {
    var nextTarget = pendingSeekTarget;
    pendingSeekTarget = null;
    applySafeSeek(nextTarget);
  }
});

function seekBy(s){
  var v = $("video");
  if(!v.duration) return;
  var base = (pendingSeekTarget !== null) ? pendingSeekTarget : v.currentTime;
  applySafeSeek(base + s);
  resetUIHide();
}

function skipIntro(){
  applySafeSeek(INTRO_THRESHOLD);
  $("skipIntroBtn").style.display = "none";
  resetUIHide();
}

function playNextEpisode(){
  var nextId = current + 1;
  if(links[String(nextId)]){
    var nextEp = getEpisode(nextId);
    if (nextEp) {
      var seasonDiv = $("season-" + nextEp.s);
      if (seasonDiv && seasonDiv.className.indexOf("open") === -1) {
        toggleSeason(nextEp.s);
      }
    }
    playEpisode(nextId);
  } else {
    toast("Žádná další epizoda nemá odkaz.");
  }
}

function toggleCC() {
  var v = $("video");
  if (!v.textTracks || v.textTracks.length === 0) {
    toast("Tento díl nemá externí titulky.");
    return;
  }
  subtitlesActive = !subtitlesActive;
  var subEl = $("subtitlesOverlay");
  if (!subtitlesActive) {
    subEl.style.display = "none";
    $("ccBtn").className = "ctrl";
    toast("Titulky vypnuty");
  } else {
    $("ccBtn").className = "ctrl active";
    updateSubtitlesDisplay(currentSubTrack || v.textTracks[0]);
    toast("Titulky zapnuty");
  }
}

function closePlayer(){ 
  saveCurrentProgress();
  
  var v = $("video");
  v.pause(); 
  v.removeAttribute("src"); 
  v.load(); 
  
  document.body.className = "";
  $("player").className = "player";
  
  $("resumeCard").className = "resume-card";
  $("skipIntroBtn").style.display = "none";
  $("nextEpBtnClean").style.display = "none";
  $("subtitlesOverlay").style.display = "none";
  clearTimeout(hideTimer);
  
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(function(){});
  }
  
  var activeCard = document.querySelector('.card[data-ep="' + current + '"]');
  if(activeCard) activeCard.focus();
}

function saveCurrentProgress() {
  var v = $("video");
  if (current && v.duration && v.currentTime > 5) {
    if (v.duration - v.currentTime <= 15) {
      delete savedProgress[String(current)];
    } else {
      savedProgress[String(current)] = Math.floor(v.currentTime);
    }
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(savedProgress));
  }
}

function togglePlay(){
  var v = $("video"); 
  v.paused ? v.play() : v.pause();
}

function toggleMute(){
  var v = $("video");
  v.muted = !v.muted;
  $("muteBtn").textContent = v.muted ? "🔇" : "🔊";
}

function toggleFullscreen(){
  var el = $("player");
  var v = $("video");
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(function(){});
  } else {
    try {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    } catch(e){}
  }
}

function fmt(s){
  if(!isFinite(s) || isNaN(s)) return "0:00";
  s = Math.max(0, Math.floor(s));
  return Math.floor(s/60) + ":" + String(s%60 < 10 ? "0" + (s%60) : s%60);
}

/* TIMELINE PRO PC */
var pContainer = $("progressContainer");
var tooltip = $("tooltip");

function updateSeek(e){
  var v = $("video");
  if(!v.duration) return;
  var rect = pContainer.getBoundingClientRect();
  var pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  
  tooltip.style.left = (pos * 100) + "%";
  tooltip.textContent = fmt(pos * v.duration);

  if(isSeeking) {
    $("progressBar").style.width = (pos * 100) + "%";
  }
}

pContainer.addEventListener("mouseenter", function(){ tooltip.style.display = "block"; });
pContainer.addEventListener("mouseleave", function(){ if(!isSeeking) tooltip.style.display = "none"; });

pContainer.addEventListener("mousedown", function(e){
  var v = $("video");
  if(!v.duration) return;
  isSeeking = true;
  updateSeek(e);
});

window.addEventListener("mousemove", function(e){
  if(isSeeking) {
    updateSeek(e);
  } else if(pContainer.contains(e.target)) {
    updateSeek(e);
  }
});

window.addEventListener("mouseup", function(e){
  if(isSeeking) {
    var v = $("video");
    if(v.duration) {
      var rect = pContainer.getBoundingClientRect();
      var pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      applySafeSeek(pos * v.duration);
    }
    isSeeking = false;
    tooltip.style.display = "none";
  }
});

/* HLÍDÁNÍ ČASU PRO SKIP INTRO A DALŠÍ DÍL */
$("video").addEventListener("timeupdate", function(){
  var v = $("video");
  if (!v.duration) return;

  if(!isSeeking) {
    $("progressBar").style.width = (v.currentTime / v.duration * 100) + "%";
  }
  $("time").textContent = fmt(v.currentTime) + " / " + fmt(v.duration);

  saveCurrentProgress();

  if (v.currentTime < INTRO_THRESHOLD) {
    $("skipIntroBtn").style.display = "block";
  } else {
    $("skipIntroBtn").style.display = "none";
  }

  var timeLeft = v.duration - v.currentTime;
  var nextId = current + 1;
  var hasNextEpisode = !!links[String(nextId)];

  if (hasNextEpisode && timeLeft <= NEXT_EPISODE_TRIGGER && timeLeft > 0) {
    $("nextEpBtnClean").style.display = "block";
  } else {
    $("nextEpBtnClean").style.display = "none";
  }

  updateSubtitlesDisplay();
});

$("video").addEventListener("ended", function(){
  delete savedProgress[String(current)];
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(savedProgress));
  
  if (links[String(current + 1)]) playNextEpisode();
});

$("video").addEventListener("play", function(){ 
  $("playBtn").textContent = "Ⅱ"; 
  $("bigPlayBtn").textContent = "Ⅱ"; 
});

$("video").addEventListener("pause", function(){ 
  $("playBtn").textContent = "▶"; 
  $("bigPlayBtn").textContent = "▶"; 
});

/* DRAG & DROP LOGIKA PRO TITULKY (VYCENTROVÁNO NA STŘED) */
var subEl = $("subtitlesOverlay");
var isDraggingSub = false;
var subStartX, subStartY, subInitialCenterX, subInitialTop;

subEl.addEventListener("mousedown", function(e) {
  if (e.button !== 0) return; // Pouze levé tlačítko
  isDraggingSub = true;
  subEl.classList.add("dragging");
  
  var rect = subEl.getBoundingClientRect();
  var parentRect = $("videoWrap").getBoundingClientRect();
  
  // Vypočítáme aktuální STŘED titulků
  var currentCenterX = (rect.left + (rect.width / 2)) - parentRect.left;
  var currentTop = rect.top - parentRect.top;
  
  // Ukotvení na střed přes translateX(-50%)
  subEl.style.bottom = "auto";
  subEl.style.left = currentCenterX + "px";
  subEl.style.top = currentTop + "px";
  subEl.style.transform = "translateX(-50%)";
  
  subStartX = e.clientX;
  subStartY = e.clientY;
  subInitialCenterX = currentCenterX;
  subInitialTop = currentTop;
  
  e.preventDefault();
  e.stopPropagation();
});

window.addEventListener("mousemove", function(e) {
  if (!isDraggingSub) return;
  var dx = e.clientX - subStartX;
  var dy = e.clientY - subStartY;
  
  var parentRect = $("videoWrap").getBoundingClientRect();
  var subRect = subEl.getBoundingClientRect();
  
  var newCenterX = subInitialCenterX + dx;
  var newTop = subInitialTop + dy;
  
  // Omezení v rámci obrazovky
  var halfWidth = subRect.width / 2;
  newCenterX = Math.max(halfWidth + 10, Math.min(parentRect.width - halfWidth - 10, newCenterX));
  newTop = Math.max(10, Math.min(parentRect.height - subRect.height - 10, newTop));
  
  subEl.style.left = newCenterX + "px";
  subEl.style.top = newTop + "px";
});

window.addEventListener("mouseup", function() {
  if (isDraggingSub) {
    isDraggingSub = false;
    subEl.classList.remove("dragging");
  }
});

// Dvojklik vrátí titulky zpět dolů na střed
subEl.addEventListener("dblclick", function(e) {
  e.stopPropagation();
  resetSubtitlePosition();
  toast("Pozice titulků resetována");
});

$("videoWrap").addEventListener("click", function(e){
  if (e.target.closest('#subtitlesOverlay') || e.target.closest('.player-ui') || e.target.closest('.player-top') || e.target.closest('.resume-card') || e.target.closest('.touch-overlay-controls') || e.target.closest('.skip-intro-btn') || e.target.closest('.next-ep-btn-clean')) return;
  
  if (clickTimer == null) {
    clickTimer = setTimeout(function() {
      clickTimer = null;
      togglePlay();
      resetUIHide();
    }, 250);
  } else {
    clearTimeout(clickTimer);
    clickTimer = null;
    toggleFullscreen();
    resetUIHide();
  }
});

$("player").addEventListener("mousemove", resetUIHide);

document.addEventListener("keydown", function(e){
  var isPlayerOpen = $("player").className.indexOf("open") !== -1;

  if (e.key === "Escape" || e.key === "Backspace") {
    if(isPlayerOpen) {
      e.preventDefault();
      closePlayer();
    } else if($("adminModal").className.indexOf("open") !== -1) {
      e.preventDefault();
      closeAdmin();
    }
    return;
  }

  if (isPlayerOpen) {
    if ($("resumeCard").className.indexOf("show") !== -1) {
      if (e.key === "ArrowLeft") $("resumeOkBtn").focus();
      if (e.key === "ArrowRight") $("resumeNoBtn").focus();
      return;
    }

    resetUIHide();

    if (e.key === " ") { e.preventDefault(); togglePlay(); }
    else if (e.key === "ArrowLeft") seekBy(-10);
    else if (e.key === "ArrowRight") seekBy(10);
    else if (e.key === "m" || e.key === "M") toggleMute();
    else if (e.key === "f" || e.key === "F") toggleFullscreen();
    else if (e.key === "c" || e.key === "C") toggleCC();
  }
});

function resetUIHide(){
  clearTimeout(hideTimer);
  $("player").className = "player open";
  if(!$("video").paused){
    hideTimer = setTimeout(function(){
      if(document.activeElement !== $("closePlayerBtn") && !isSeeking && !isDraggingSub) {
        $("player").className = "player open hide-ui";
      }
    }, 3500);
  }
}

function toast(t){
  $("toast").textContent = t;
  $("toast").style.display = "block";
  setTimeout(function(){ $("toast").style.display = "none"; }, 1800);
}

loadAutoJSON();
