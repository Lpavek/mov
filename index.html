<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Přehrávač seriálů</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#050505;color:#fff;font-family:sans-serif}
h1{margin:0 0 15px 0;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:25px}
.card{background:#181818;border:2px solid #333;border-radius:6px;padding:12px;text-align:center}
.card.has-link{border-color:#a50909}
button{background:#a50909;color:#fff;border:0;padding:10px 14px;border-radius:4px;font-weight:bold;cursor:pointer;width:100%;font-size:14px;margin-top:8px}
button:disabled{background:#333;color:#777;cursor:not-allowed}
button:focus{outline:3px solid #fff;background:#e51a1a}

/* PŘEHRÁVAČ BOX - JEDNODUCHÝ A VIDITELNÝ */
#playerBox{display:none;background:#111;border:2px solid #a50909;border-radius:8px;padding:15px;margin-top:15px}
#playerHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#epTitle{font-size:20px;font-weight:bold;color:#fff}
.big-btn{width:auto;padding:8px 16px;margin:0}
video{width:100%;max-height:70vh;background:#000;margin-top:10px;display:block}
</style>
</head>
<body>

<h1>Můj Přehrávač</h1>

<div class="grid" id="episodes"></div>

<div id="playerBox">
  <div id="playerHeader">
    <span id="epTitle">Epizoda</span>
    <div>
      <button class="big-btn" onclick="makeFullscreen()">⛶ Zvětšit na celou obrazovku</button>
      <button class="big-btn" style="background:#333" onclick="closePlayer()">✕ Zavřít</button>
    </div>
  </div>
  <!-- Nativní HTML5 video přehrávač se všemi systémovými ovládacími prvky -->
  <video id="mainVideo" controls playsinline preload="auto"></video>
</div>

<script>
var EPISODES = [1,2,3,4,5,6,7,8];
var links = {};
var video = document.getElementById("mainVideo");

function loadJSON() {
  fetch('episodes.json?v=' + new Date().getTime())
    .then(function(r){ return r.ok ? r.json() : {}; })
    .then(function(d){ links = d || {}; render(); })
    .catch(function(){ render(); });
}

function render() {
  var html = "";
  for (var i = 0; i < EPISODES.length; i++) {
    var n = EPISODES[i];
    var key = String(n);
    var hasLink = links[key] && links[key].trim().length > 0;
    
    html += '<div class="card ' + (hasLink ? 'has-link' : '') + '">' +
      '<div><strong>Epizoda ' + n + '</strong></div>' +
      '<button ' + (hasLink ? '' : 'disabled') + ' onclick="playEp(' + n + ')">' + 
        (hasLink ? '▶ PŘEHRÁT' : 'Bez odkazu') + 
      '</button>' +
    '</div>';
  }
  document.getElementById("episodes").innerHTML = html;
}

function playEp(n) {
  var url = links[String(n)];
  if(!url) return;
  
  document.getElementById("epTitle").textContent = "Epizoda " + n;
  document.getElementById("playerBox").style.display = "block";
  
  video.src = url;
  video.play().catch(function(){});
  
  // Sklouznout pohledem na přehrávač
  document.getElementById("playerBox").scrollIntoView();
  
  // Pokus o automatické zvětšení na TV
  setTimeout(makeFullscreen, 500);
}

function makeFullscreen() {
  if (video.requestFullscreen) {
    video.requestFullscreen();
  } else if (video.webkitRequestFullscreen) {
    video.webkitRequestFullscreen();
  } else if (video.msRequestFullscreen) {
    video.msRequestFullscreen();
  }
}

function closePlayer() {
  video.pause();
  video.removeAttribute("src");
  video.load();
  document.getElementById("playerBox").style.display = "none";
}

loadJSON();
</script>
</body>
</html>
