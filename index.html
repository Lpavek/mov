<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Přehrávač seriálů — TV Edition</title>
<style>
:root{
  --bg:#070707; --panel:#111; --panel2:#171717; --text:#f2f2f2;
  --muted:#8f8f8f; --red:#a50909; --red2:#e51a1a; --line:#292929;
  --focus-glow: 0 0 15px rgba(229, 26, 26, 0.8);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif; user-select:none; overflow-x:hidden}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}

/* TV FOCUS ENGINE STYLES (Důležité pro ovladač) */
:focus, .tv-focus {
  outline: none !important;
  border-color: var(--red2) !important;
  box-shadow: var(--focus-glow) !important;
  transform: scale(1.05);
  z-index: 5;
}

.hero{
  min-height:35vh;padding:40px 6vw 20px;display:flex;align-items:flex-end;
  background:
    radial-gradient(circle at 72% 40%,rgba(160,0,0,.15),transparent 35%),
    linear-gradient(180deg,rgba(0,0,0,.05),#070707 95%);
}
.brand{font-weight:900;letter-spacing:.16em;font-size:14px;color:#c40000}
.hero h1{font-size:clamp(40px,7vw,80px);line-height:1;margin:12px 0;text-transform:uppercase;letter-spacing:-.03em}
.badge{display:inline-block;background:#a50909;padding:6px 12px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.container{width:min(1280px,90vw);margin:auto}
.section-title{font-size:24px;margin:25px 0 16px; font-weight: 800;}

/* Epizody v gridu přizpůsobeném pro šipky */
.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding-bottom:60px}
.card{
  background:linear-gradient(145deg,#171717,#0d0d0d);border:2px solid var(--line);
  border-radius:10px;padding:22px;min-height:170px;transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  display:flex; flex-direction:column; justify-content:space-between;
}
.ep{color:#a9a9a9;font-size:13px;text-transform:uppercase;letter-spacing:.1em; font-weight:700;}
.card h3{margin:8px 0 16px;font-size:22px}
.play{border:0;border-radius:6px;background:#eee;color:#090909;padding:12px 18px;font-weight:800; font-size:15px; transition: 0.15s;}
.card:focus-within .play, .card.tv-focus .play { background: var(--red2); color:#fff; }

.admin{
  position:fixed;right:25px;bottom:25px;border:2px solid #444;background:#151515;color:#fff;
  border-radius:999px;padding:14px 22px;z-index:20; font-weight:700; font-size:15px; transition: 0.2s;
}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:30;overflow:auto;padding:35px 15px}
.modal.open{display:block}
.panel{width:min(780px,100%);margin:auto;background:#101010;border:2px solid #333;border-radius:12px;padding:28px}
.panel h2{margin-top:0}
.formrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin:14px 0}
input,select{width:100%;background:#080808;color:#fff;border:2px solid #444;border-radius:8px;padding:12px; font-size:16px;}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.action{border:0;border-radius:8px;padding:12px 18px;background:#ddd;color:#111;font-weight:800; font-size:15px; transition: 0.2s;}
.action.red{background:var(--red);color:#fff}
.saved{margin-top:22px;border-top:1px solid #292929;padding-top:15px}
.savedrow{display:flex;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #222;}

/* PŘEHRÁVAČ S TV OVLÁDÁNÍM */
.player{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column; cursor:none;}
.player.open{display:flex}

.video-wrap{position:relative;flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center; overflow:hidden;}
video{width:100%;height:100%;object-fit:contain}

/* TV Seek Indicator (-10s / +10s animace na středu obrazovky) */
.seek-indicator {
  position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.7);
  color: #fff; padding: 18px 30px; border-radius: 50px; font-size: 24px; font-weight: 900;
  border: 2px solid var(--red2); display: none; pointer-events: none; z-index: 20;
}
.seek-indicator.left { left: 10%; }
.seek-indicator.right { right: 10%; }

.player-ui, .player-top {
  position:absolute; transition:opacity .25s ease, transform .25s ease; z-index:10;
}
.player-top {
  top:0; left:0; right:0; padding:30px 4vw; display:flex; justify-content:space-between; align-items:center;
  background:linear-gradient(180deg, rgba(0,0,0,0.9), transparent); pointer-events:none;
}
.player-top * { pointer-events:auto; }
.now{font-weight:800; font-size:20px; text-shadow:0 2px 10px #000; color:#fff;}

.player-ui{
  bottom:0; left:0; right:0; padding:50px 4vw 30px;
  background:linear-gradient(transparent, rgba(0,0,0,0.95));
}

.player.hide-ui .player-ui { opacity:0; transform:translateY(15px); pointer-events:none; }
.player.hide-ui .player-top { opacity:0; transform:translateY(-15px); pointer-events:none; }

.progress-container{ position:relative; padding:12px 0; margin-bottom:15px; }
.progress{ height:8px; background:#444; border-radius:6px; position:relative; }
.progress-bar{ height:100%; width:0; background:var(--red2); border-radius:6px; position:relative;}

.controls{display:flex;align-items:center;gap:14px}
.ctrl{
  width:54px;height:48px;border:2px solid transparent;border-radius:8px;background:rgba(30,30,30,.9);color:#fff;font-size:20px; transition:0.15s;
}
.time{font-variant-numeric:tabular-nums;color:#ddd;font-size:16px;margin:0 10px; font-weight:700;}
.spacer{flex:1}

/* Netflix Next Episode TV Widget */
.next-ep-card {
  position: absolute; right: 4vw; bottom: 120px; z-index: 25;
  background: rgba(18, 18, 18, 0.95); border: 2px solid var(--red2);
  border-radius: 10px; padding: 18px 24px; display: none; align-items: center; gap: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px);
}
.next-ep-card.show { display: flex; }
.next-ep-info .label { font-size: 12px; text-transform: uppercase; color: #aaa; letter-spacing: 0.05em; font-weight:700;}
.next-ep-info .title { font-size: 18px; font-weight: 800; color: #fff; margin-top: 2px; }

.next-btn {
  position: relative; overflow: hidden; border: 0; border-radius: 6px;
  background: #333; color: #fff; padding: 12px 22px; font-weight: 800; font-size: 16px;
  display: flex; align-items: center; gap: 8px; cursor: pointer;
}
.next-btn-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: var(--red2); opacity: 0.9; }
.next-btn-text { position: relative; z-index: 2; }
.cancel-next { background: transparent; border: 0; color: #888; font-size: 20px; padding: 6px; border-radius: 6px; }

.toast{position:fixed;left:50%;bottom:35px;transform:translateX(-50%);background:#eee;color:#111;padding:12px 24px;border-radius:8px;display:none;z-index:60;font-weight:800; font-size:16px;}
</style>
</head>
<body>

<header class="hero">
  <div>
    <div class="brand">KNIHOVNA / SERIÁLY</div>
    <h1>Můj Přehrávač</h1>
    <span class="badge">1. Série</span>
  </div>
</header>

<main class="container">
  <h2 class="section-title">Vyber epizodu</h2>
  <div id="episodes" class="episodes"></div>
</main>

<button class="admin" id="adminBtn" tabindex="0" onclick="openAdmin()">⚙ Nastavení</button>

<div id="adminModal" class="modal">
  <div class="panel">
    <h2>Správa odkazů</h2>
    <div class="formrow"><label>Epizoda</label><select id="episodeSelect" tabindex="0"></select></div>
    <div class="formrow"><label>Odkaz</label><input id="urlInput" placeholder="https://example.com/video.mp4" tabindex="0"></div>
    <div class="actions">
      <button class="action red" id="saveBtn" tabindex="0" onclick="saveLink()">Uložit dočasně</button>
      <button class="action" tabindex="0" onclick="closeAdmin()">Zavřít</button>
    </div>
    <div id="saved" class="saved"></div>
  </div>
</div>

<div id="player" class="player">
  <div class="video-wrap" id="videoWrap">
    
    <div class="seek-indicator left" id="seekLeft">↶ 10s</div>
    <div class="seek-indicator right" id="seekRight">10s ↷</div>

    <div class="player-top">
      <div class="now" id="now"></div>
      <button class="ctrl close" id="closePlayerBtn" tabindex="0" onclick="closePlayer()" title="Zavřít">✕</button>
    </div>

    <video id="video" playsinline preload="metadata"></video>

    <!-- Netflix Auto-Skip Widget -->
    <div class="next-ep-card" id="nextEpCard">
      <div class="next-ep-info">
        <span class="label">Další epizoda</span>
        <span class="title" id="nextEpTitle">Epizoda X</span>
      </div>
      <button class="next-btn" id="nextEpBtn" tabindex="0" onclick="playNextEpisode()">
        <div class="next-btn-fill" id="nextBtnFill"></div>
        <span class="next-btn-text">Přehrát díl <span id="nextCountdown">10</span>s ▶</span>
      </button>
      <button class="cancel-next" id="cancelNextBtn" tabindex="0" onclick="dismissNextPrompt()" title="Zrušit">✕</button>
    </div>
    
    <div class="player-ui" id="playerUI">
      <div class="progress-container">
        <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
      </div>

      <div class="controls">
        <button class="ctrl" id="seekBackBtn" tabindex="0" onclick="seekBy(-10)" title="Zpět 10 s">↶</button>
        <button class="ctrl" id="playBtn" tabindex="0" onclick="togglePlay()">▶</button>
        <button class="ctrl" id="seekForwardBtn" tabindex="0" onclick="seekBy(10)" title="Dopředu 10 s">↷</button>
        <span class="time" id="time">0:00 / 0:00</span>
        <span class="spacer"></span>
        <button class="ctrl" id="muteBtn" tabindex="0" onclick="toggleMute()">🔊</button>
        <button class="ctrl" id="fullBtn" tabindex="0" onclick="toggleFullscreen()">⛶</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const EPISODES = Array.from({length:8},(_,i)=>({n:i+1,title:`Epizoda ${i+1}`}));
const SKIP_THRESHOLD = 10;

let links = {};
let current = 0, hideTimer = null, seekTimerLeft = null, seekTimerRight = null;
let nextPromptDismissed = false;

const $=id=>document.getElementById(id);

async function loadAutoJSON() {
  try {
    const res = await fetch('episodes.json?v=' + Date.now());
    if (res.ok) links = await res.json();
  } catch (err) {}
  render();
}

function render(){
  $("episodes").innerHTML=EPISODES.map(e=>{
    const key = String(e.n);
    const hasLink = !!(links[key] && links[key].trim());
    return `
    <article class="card" tabindex="0" data-ep="${e.n}" onclick="playEpisode(${e.n})">
      <div class="ep">Epizoda ${e.n}</div>
      <h3>${e.title}</h3>
      <button class="play" tabindex="-1">${hasLink ? "▶ Přehrát" : "○ Bez odkazu"}</button>
    </article>`;
  }).join("");

  // Po vykreslení dát automaticky Focus na 1. epizodu pro ovladač TV
  const firstCard = document.querySelector('.card');
  if(firstCard && !$("player").classList.contains("open")) firstCard.focus();
}

function openAdmin(){
  $("adminModal").classList.add("open");
  $("episodeSelect").innerHTML=EPISODES.map(e=>`<option value="${e.n}">Epizoda ${e.n}</option>`).join("");
  $("episodeSelect").onchange=loadSelected;
  loadSelected();
  $("episodeSelect").focus();
}
function closeAdmin(){
  $("adminModal").classList.remove("open");
  $("adminBtn").focus();
}
function loadSelected(){ 
  const key = String($("episodeSelect").value);
  $("urlInput").value = links[key] || ""; 
}

function saveLink(){
  const n = String($("episodeSelect").value);
  const url = $("urlInput").value.trim();
  if(!url){toast("Vlož nejdřív odkaz.");return}
  links[n] = url;
  render(); toast(`Dočasně uloženo.`);
}

function playEpisode(n){
  const key = String(n);
  if(!links[key]){ openAdmin(); $("episodeSelect").value=n; loadSelected(); toast(`Epizoda ${n} nemá odkaz.`); return; }
  current=n; 
  nextPromptDismissed = false;
  hideNextPrompt();

  $("now").textContent=`Epizoda ${n}`;
  $("video").src=links[key]; 
  $("player").classList.add("open");
  $("video").play().catch(()=>{});
  resetUIHide();
  $("playBtn").focus();
}

function playNextEpisode(){
  if(links[String(current + 1)]){
    playEpisode(current + 1);
  }
}

function dismissNextPrompt(){
  nextPromptDismissed = true;
  hideNextPrompt();
  $("playBtn").focus();
}

function hideNextPrompt(){ $("nextEpCard").classList.remove("show"); }

function closePlayer(){ 
  $("video").pause(); 
  $("video").removeAttribute("src"); 
  $("video").load(); 
  $("player").classList.remove("open");
  hideNextPrompt();
  clearTimeout(hideTimer);
  
  // Vracení focusu na naposledy přehrávanou epizodu
  const activeCard = document.querySelector(`.card[data-ep="${current}"]`);
  if(activeCard) activeCard.focus();
}

function togglePlay(){
  const v=$("video"); 
  v.paused ? v.play() : v.pause();
}

function seekBy(s){
  const v=$("video");
  if(!v.duration) return;
  v.currentTime=Math.max(0,Math.min(v.duration, v.currentTime+s));
  
  // Vizuální TV ukazatel přetočení
  if(s < 0) {
    $("seekLeft").style.display = "block";
    clearTimeout(seekTimerLeft);
    seekTimerLeft = setTimeout(() => $("seekLeft").style.display = "none", 800);
  } else {
    $("seekRight").style.display = "block";
    clearTimeout(seekTimerRight);
    seekTimerRight = setTimeout(() => $("seekRight").style.display = "none", 800);
  }
  resetUIHide();
}

function toggleMute(){
  const v=$("video");
  v.muted=!v.muted;
  $("muteBtn").textContent=v.muted?"🔇":"🔊";
}

function toggleFullscreen(){
  const el=$("player");
  if(document.fullscreenElement) document.exitFullscreen();
  else el.requestFullscreen?.();
}

function fmt(s){
  if(!isFinite(s) || isNaN(s)) return "0:00";
  s=Math.max(0,Math.floor(s));
  return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
}

/* TIMELINE & AKTUALIZACE ČASU */
$("video").addEventListener("timeupdate", () => {
  let v = $("video");
  if (!v.duration) return;

  $("progressBar").style.width = (v.currentTime / v.duration * 100) + "%";
  $("time").textContent = `${fmt(v.currentTime)} / ${fmt(v.duration)}`;

  const timeLeft = v.duration - v.currentTime;
  const nextEpNum = current + 1;
  const hasNextEpisode = !!links[String(nextEpNum)];

  if (hasNextEpisode && !nextPromptDismissed && timeLeft <= SKIP_THRESHOLD && timeLeft > 0) {
    $("nextEpTitle").textContent = `Epizoda ${nextEpNum}`;
    $("nextCountdown").textContent = Math.ceil(timeLeft);
    $("nextBtnFill").style.width = `${((SKIP_THRESHOLD - timeLeft) / SKIP_THRESHOLD) * 100}%`;
    
    if(!$("nextEpCard").classList.contains("show")) {
      $("nextEpCard").classList.add("show");
      $("nextEpBtn").focus(); // Dáme focus přímo na skip tlačítko pro TV ovladač
    }
  } else {
    hideNextPrompt();
  }
});

$("video").addEventListener("ended", () => {
  if (links[String(current + 1)]) playNextEpisode();
});

$("video").addEventListener("play",()=>{$("playBtn").textContent="Ⅱ"});
$("video").addEventListener("pause",()=>{$("playBtn").textContent="▶"});

/* D-PAD SPATIAL NAVIGATION (Pro ovladače Smart TV) */
document.addEventListener("keydown", e => {
  const isPlayerOpen = $("player").classList.contains("open");

  // Klávesa Zpět na ovladači (Backspace nebo Escape)
  if (e.key === "Escape" || e.key === "Backspace") {
    if(isPlayerOpen) {
      e.preventDefault();
      closePlayer();
    } else if($("adminModal").classList.contains("open")) {
      e.preventDefault();
      closeAdmin();
    }
    return;
  }

  // Když běží přehrávač
  if (isPlayerOpen) {
    resetUIHide();

    // Rychlé přetáčení šipkami vlevo / vpravo, pokud uživatel zrovna nemíří na konkrétní tlačítko
    if (e.key === "ArrowLeft" && document.activeElement === $("playBtn")) {
      seekBy(-10);
    } else if (e.key === "ArrowRight" && document.activeElement === $("playBtn")) {
      seekBy(10);
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      // Zobrazení UI lišty při stisku šipek nahoru/dolů
      $("player").classList.remove("hide-ui");
    } else if (e.key === " " || e.key === "MediaPlayPause") {
      e.preventDefault();
      togglePlay();
    }
  }
});

function resetUIHide(){
  clearTimeout(hideTimer);
  $("player").classList.remove("hide-ui");
  if(!$("video").paused){
    hideTimer = setTimeout(()=>{
      // Po 3.5 sekundách neaktivity schovat rozhraní
      if(document.activeElement !== $("closePlayerBtn")) {
        $("player").classList.add("hide-ui");
      }
    }, 3500);
  }
}

function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}

loadAutoJSON();
</script>
</body>
</html>
