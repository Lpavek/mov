<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knihovna — Domů</title>
<style>
:root {
  --bg: #070707;
  --panel: #141414;
  --text: #f2f2f2;
  --muted: #8f8f8f;
  --blue: #2563eb;
  --line: #292929;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  user-select: none;
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
}

/* TV Focus & Klávesnice */
:focus, .tv-focus {
  outline: none !important;
  border-color: var(--blue) !important;
  box-shadow: 0 0 25px rgba(37, 99, 235, 1) !important;
  transform: scale(1.02);
  z-index: 5;
}

.hero {
  padding: 30px 5vw 15px;
  background: #0d0d0d;
  border-bottom: 2px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.brand {
  font-weight: 900;
  letter-spacing: .15em;
  font-size: 13px;
  color: var(--blue);
}
.hero h1 {
  font-size: 36px;
  margin: 8px 0 0;
  text-transform: uppercase;
  letter-spacing: -.02em;
}

.container {
  width: 90vw;
  margin: 30px auto 100px;
}

.section-label {
  font-size: 16px;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin: 30px 0 15px;
}
.section-label:first-child {
  margin-top: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.card {
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 8px;
  padding: 22px;
  min-height: 160px;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.15s, border-color 0.15s, background 0.15s;
}

.card:hover, .card:focus {
  background: #1c1c1c;
  border-color: var(--blue);
}

.tag {
  color: var(--blue);
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.card h3 {
  margin: 10px 0 14px;
  font-size: 20px;
  color: #fff;
  font-weight: 800;
}

.card-bottom {
  display: flex;
  justify-content: flex-end;
}

.btn {
  border: 0;
  border-radius: 4px;
  background: #eee;
  color: #000;
  padding: 10px 18px;
  font-weight: 800;
  font-size: 14px;
  cursor: pointer;
  transition: 0.15s;
}

.card:hover .btn,
.card:focus .btn {
  background: var(--blue);
  color: #fff;
}
</style>
</head>
<body>

<header class="hero">
  <div>
    <div class="brand">KNIHOVNA / ROZCESTNÍK</div>
    <h1>DOMŮ</h1>
  </div>
</header>

<main class="container">

  <!-- UNIVERZÁLNÍ -->
  <div class="section-label">Univerzální</div>
  <div class="grid">
    <a href="film/film.html" class="card" tabindex="0">
      <div>
        <div class="tag">Film</div>
        <h3>Univerzální film</h3>
      </div>
      <div class="card-bottom">
        <span class="btn">Otevřít ▶</span>
      </div>
    </a>

    <a href="serial.html" class="card" tabindex="0">
      <div>
        <div class="tag">Seriál</div>
        <h3>Univerzální seriál</h3>
      </div>
      <div class="card-bottom">
        <span class="btn">Otevřít ▶</span>
      </div>
    </a>
  </div>

  <!-- KONKRÉTNÍ -->
  <div class="section-label">Konkrétní</div>
  <div class="grid">
    <a href="dexter/dexter.html" class="card" tabindex="0">
      <div>
        <div class="tag">Seriál • 9 sérií</div>
        <h3>DEXTER</h3>
      </div>
      <div class="card-bottom">
        <span class="btn">Otevřít ▶</span>
      </div>
    </a>
  </div>

</main>

<script>
// Ovládání šipkami z ovladače i klávesnice
document.addEventListener("keydown", function(e) {
  var cards = Array.from(document.querySelectorAll(".card"));
  var index = cards.indexOf(document.activeElement);

  if (index === -1) {
    if (["ArrowDown", "ArrowUp", "ArrowRight", "ArrowLeft"].includes(e.key)) {
      cards[0].focus();
    }
    return;
  }

  if (e.key === "ArrowRight" || e.key === "ArrowDown") {
    var next = cards[index + 1] || cards[0];
    next.focus();
  } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
    var prev = cards[index - 1] || cards[cards.length - 1];
    prev.focus();
  }
});
</script>

</body>
</html>
